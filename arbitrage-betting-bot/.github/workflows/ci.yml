name: CI

on:
  push:
    paths:
      - "arbitrage-betting-bot/**"
  pull_request:
    paths:
      - "arbitrage-betting-bot/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arbitrage-betting-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest
